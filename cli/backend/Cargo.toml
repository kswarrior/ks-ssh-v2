[package]
name = "ks-ssh"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = { version = "0.8.9", features = ["ws"] }
base32 = "0.5.1"
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mime_guess = "2.0.5"
portable-pty = "0.8"
rand_core = "0.10.1"
reqwest = { version = "0.13.5", features = ["json", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.12.0"
rustls = { version = "0.23.44", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["fs"] }
zeroize = { version = "1.9.0", features = ["derive"] }

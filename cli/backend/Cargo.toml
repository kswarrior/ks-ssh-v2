[package]
name = "ks-ssh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
rustls = { version = "0.23.44", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }

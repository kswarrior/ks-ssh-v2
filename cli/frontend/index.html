<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="KS SSH frontend" />
    <meta name="theme-color" content="#e8edf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05080f" media="(prefers-color-scheme: dark)" />
    <title>KS SSH</title>
    <script>
      try {
        var t = localStorage.getItem('ks-ssh:theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
